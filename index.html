<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MLBB Topic Sender</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0f1c;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      margin: 0;
      overflow: hidden;
      touch-action: manipulation;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    /* ========== HEADER ========== */
    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 8px;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #f1f5f9;
    }

    /* ========== MAIN CARD (Compact) ========== */
    .main-card {
      background: #111827;
      border-radius: 20px;
      padding: 16px;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      margin-bottom: 12px;
    }

    /* ========== SELECT BUTTONS (Compact Bar) ========== */
    .select-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .select-btn {
      flex: 1;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .select-btn:active {
      transform: scale(0.97);
      border-color: #3b82f6;
    }

    .select-btn .btn-icon {
      font-size: 1.2rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .select-btn .btn-icon.bot { background: #1e3a5f; }
    .select-btn .btn-icon.topic { background: #2d1b4e; }

    .select-btn .btn-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .select-btn .btn-label {
      font-size: 0.65rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .select-btn .btn-value {
      font-size: 0.9rem;
      color: #f1f5f9;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .select-btn .btn-arrow {
      color: #475569;
      font-size: 1rem;
    }

    /* ========== IMAGE DROPZONE (Compact) ========== */
    .image-dropzone {
      background: #0f172a;
      border: 1.5px dashed #1e293b;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
      margin-bottom: 10px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .image-dropzone:active {
      border-color: #3b82f6;
    }

    .image-dropzone.has-image {
      border-style: solid;
      border-color: #22c55e;
      padding: 6px;
    }

    .dropzone-placeholder {
      color: #475569;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .image-preview-container {
      width: 100%;
      position: relative;
      display: none;
    }

    .image-dropzone.has-image .image-preview-container {
      display: block;
    }

    .image-dropzone.has-image .dropzone-placeholder {
      display: none;
    }

    .image-preview {
      width: 100%;
      max-height: 140px;
      object-fit: contain;
      border-radius: 8px;
      display: block;
    }

    .remove-image-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      touch-action: manipulation;
    }

    .remove-image-btn:active {
      background: #dc2626;
      transform: scale(0.9);
    }

    /* ========== TEXTAREA (Compact) ========== */
    textarea {
      width: 100%;
      height: 80px;
      background: #0f172a;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      color: #f1f5f9;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.5;
      -webkit-user-select: text;
      user-select: text;
    }

    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    textarea::placeholder {
      color: #475569;
    }

    .char-count {
      text-align: right;
      font-size: 0.65rem;
      color: #64748b;
      margin-top: 4px;
    }

    /* ========== SEND BUTTON ========== */
    .send-btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #6366f1);
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 20px rgba(37,99,235,0.4);
      touch-action: manipulation;
      margin-bottom: 10px;
    }

    .send-btn:active:not(:disabled) {
      transform: scale(0.97);
      background: #1d4ed8;
    }

    .send-btn:disabled {
      opacity: 0.5;
      background: #334155;
      pointer-events: none;
    }

    /* ========== STATUS (Compact) ========== */
    .status-bar {
      background: #111827;
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid #1e293b;
      font-size: 0.78rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-bar.success { border-color: #16a34a; color: #86efac; }
    .status-bar.error { border-color: #dc2626; color: #fca5a5; }
    .status-bar.loading { border-color: #f59e0b; color: #fcd34d; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== MODAL OVERLAY ========== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-sheet {
      background: #111827;
      border-radius: 24px 24px 0 0;
      width: 100%;
      max-width: 420px;
      max-height: 70vh;
      overflow-y: auto;
      padding: 10px 16px 30px;
      animation: slideUp 0.3s ease;
      border-top: 1px solid #1e293b;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin: 0 auto 14px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
      text-align: center;
    }

    .modal-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-item {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .modal-item:active {
      transform: scale(0.98);
    }

    .modal-item.selected {
      border-color: #3b82f6;
      background: #1a1f35;
    }

    .modal-item.selected-bot-yuto { border-color: #3b82f6; }
    .modal-item.selected-bot-hina { border-color: #ec4899; }
    .modal-item.selected-bot-yui { border-color: #10b981; }

    .modal-item-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .icon-bot-yuto { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .icon-bot-hina { background: linear-gradient(135deg, #ec4899, #db2777); }
    .icon-bot-yui { background: linear-gradient(135deg, #10b981, #059669); }
    .icon-topic { background: #2d1b4e; }
    .icon-topic-general { background: #1e3a5f; }

    .modal-item-info {
      flex: 1;
      min-width: 0;
    }

    .modal-item-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .modal-item-sub {
      font-size: 0.7rem;
      color: #64748b;
    }

    .modal-item-check {
      color: #22c55e;
      font-size: 1.2rem;
      display: none;
    }

    .modal-item.selected .modal-item-check {
      display: block;
    }

    .modal-done-btn {
      width: 100%;
      background: #2563eb;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      margin-top: 14px;
      touch-action: manipulation;
    }

    .modal-done-btn:active {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
<div class="container">
  
  <!-- ==================== HEADER ==================== -->
  <div class="header">
    <div class="header-icon">📨</div>
    <h1>MLBB Topic Sender</h1>
  </div>

  <!-- ==================== MAIN CARD ==================== -->
  <div class="main-card">
    
    <!-- Bot + Topic Select Row -->
    <div class="select-row">
      <div class="select-btn" id="botSelectBtn">
        <span class="btn-icon bot">🤖</span>
        <span class="btn-info">
          <span class="btn-label">Bot</span>
          <span class="btn-value" id="botSelectValue">Yuto</span>
        </span>
        <span class="btn-arrow">›</span>
      </div>
      <div class="select-btn" id="topicSelectBtn">
        <span class="btn-icon topic">#</span>
        <span class="btn-info">
          <span class="btn-label">Topic</span>
          <span class="btn-value" id="topicSelectValue">310661</span>
        </span>
        <span class="btn-arrow">›</span>
      </div>
    </div>

    <!-- Image Dropzone -->
    <div class="image-dropzone" id="imageDropzone">
      <div class="dropzone-placeholder">
        <span>🖼️</span> ပုံထည့်ရန်နှိပ်ပါ
      </div>
      <div class="image-preview-container" id="imagePreviewContainer">
        <img id="imagePreview" class="image-preview" src="" alt="Preview">
        <button class="remove-image-btn" id="removeImageBtn">✕</button>
      </div>
    </div>
    <input type="file" id="imageInput" accept="image/*" style="display:none;">

    <!-- Message Textarea -->
    <textarea id="messageText" placeholder="စာရိုက်ပါ..." maxlength="4096"></textarea>
    <div class="char-count" id="charCount">0 / 4096</div>
  </div>

  <!-- ==================== SEND BUTTON ==================== -->
  <button id="sendBtn" class="send-btn">📤 ပို့မည်</button>

  <!-- ==================== STATUS ==================== -->
  <div class="status-bar" id="statusBar">
    <span>💬</span> <span id="statusText">အဆင်သင့်ဖြစ်ပါပြီ</span>
  </div>

  <!-- ==================== BOT SELECT MODAL ==================== -->
  <div class="modal-overlay" id="botModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">🤖 Bot ရွေးပါ</div>
      <div class="modal-list" id="botModalList"></div>
      <button class="modal-done-btn" id="botModalDone">ရွေးပြီး</button>
    </div>
  </div>

  <!-- ==================== TOPIC SELECT MODAL ==================== -->
  <div class="modal-overlay" id="topicModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">🗂️ Topic ရွေးပါ</div>
      <div class="modal-list" id="topicModalList"></div>
      <button class="modal-done-btn" id="topicModalDone">ရွေးပြီး</button>
    </div>
  </div>

</div>

<script>
(function() {
  console.log("🚀 Compact MLBB Sender Ready");

  // ==================== CONFIG ====================
  const BOT_LIST = [
    { id: "yuto", name: "Yuto", emoji: "🔵", token: "8759285648:AAHqmcMPE4tPciixG-IzPCOVIl7E1XBhm6E", color: "#3b82f6", iconClass: "icon-bot-yuto", selectedClass: "selected-bot-yuto" },
    { id: "hina", name: "Hina", emoji: "🌸", token: "8058558723:AAG0Cwgw4Z3bdOGpkEGgBeNKSdNBbsXUuwY", color: "#ec4899", iconClass: "icon-bot-hina", selectedClass: "selected-bot-hina" },
    { id: "yui", name: "Yui", emoji: "🍀", token: "8728656019:AAES3bV3_5yLTm3a0lvE1dEVWBnyE6KQAwM", color: "#10b981", iconClass: "icon-bot-yui", selectedClass: "selected-bot-yui" }
  ];

  const TOPIC_LIST = [
    { id: "310661", name: "Topic 310661", emoji: "📢" },
    { id: "310823", name: "Nova Starlar", emoji: "⭐" },
    { id: "1", name: "General", emoji: "💬", isGeneral: true }
  ];

  const GROUP_USERNAME = "@MLBBMCCTG";

  // ==================== STATE ====================
  let selectedBotIndex = 0;
  let selectedTopicId = TOPIC_LIST[0].id;
  let selectedImageFile = null;
  let isSending = false;

  // ==================== DOM ====================
  const messageTextarea = document.getElementById("messageText");
  const sendBtn = document.getElementById("sendBtn");
  const statusBar = document.getElementById("statusBar");
  const statusText = document.getElementById("statusText");
  const charCount = document.getElementById("charCount");
  const botSelectBtn = document.getElementById("botSelectBtn");
  const botSelectValue = document.getElementById("botSelectValue");
  const topicSelectBtn = document.getElementById("topicSelectBtn");
  const topicSelectValue = document.getElementById("topicSelectValue");
  const imageDropzone = document.getElementById("imageDropzone");
  const imageInput = document.getElementById("imageInput");
  const imagePreview = document.getElementById("imagePreview");
  const imagePreviewContainer = document.getElementById("imagePreviewContainer");
  const removeImageBtn = document.getElementById("removeImageBtn");
  
  // Modals
  const botModal = document.getElementById("botModal");
  const botModalList = document.getElementById("botModalList");
  const botModalDone = document.getElementById("botModalDone");
  const topicModal = document.getElementById("topicModal");
  const topicModalList = document.getElementById("topicModalList");
  const topicModalDone = document.getElementById("topicModalDone");

  // ==================== RENDER BOT MODAL ====================
  function renderBotModal() {
    botModalList.innerHTML = "";
    BOT_LIST.forEach((bot, index) => {
      const item = document.createElement("div");
      item.className = `modal-item ${index === selectedBotIndex ? 'selected ' + bot.selectedClass : ''}`;
      item.setAttribute("data-index", index);
      item.innerHTML = `
        <div class="modal-item-icon ${bot.iconClass}">${bot.emoji}</div>
        <div class="modal-item-info">
          <div class="modal-item-name">${bot.name}</div>
          <div class="modal-item-sub">${bot.token.substring(0, 22)}...</div>
        </div>
        <span class="modal-item-check">✓</span>
      `;
      item.addEventListener("click", function(e) {
        e.preventDefault();
        selectBotInModal(index);
      });
      botModalList.appendChild(item);
    });
  }

  function selectBotInModal(index) {
    const items = botModalList.querySelectorAll(".modal-item");
    items.forEach((item, i) => {
      item.className = "modal-item";
      if (i === index) {
        item.classList.add("selected");
        item.classList.add(BOT_LIST[i].selectedClass);
      }
    });
    // Update state
    selectedBotIndex = index;
    botSelectValue.textContent = BOT_LIST[index].name;
    botSelectValue.style.color = BOT_LIST[index].color;
  }

  // ==================== RENDER TOPIC MODAL ====================
  function renderTopicModal() {
    topicModalList.innerHTML = "";
    TOPIC_LIST.forEach((topic) => {
      const item = document.createElement("div");
      item.className = `modal-item ${topic.id === selectedTopicId ? 'selected' : ''}`;
      item.setAttribute("data-id", topic.id);
      const iconClass = topic.isGeneral ? "icon-topic-general" : "icon-topic";
      item.innerHTML = `
        <div class="modal-item-icon ${iconClass}">${topic.emoji}</div>
        <div class="modal-item-info">
          <div class="modal-item-name">${topic.name}</div>
          <div class="modal-item-sub">ID: ${topic.id} ${topic.isGeneral ? '(message_thread_id မပါ)' : ''}</div>
        </div>
        <span class="modal-item-check">✓</span>
      `;
      item.addEventListener("click", function(e) {
        e.preventDefault();
        selectTopicInModal(topic.id);
      });
      topicModalList.appendChild(item);
    });
  }

  function selectTopicInModal(topicId) {
    const items = topicModalList.querySelectorAll(".modal-item");
    items.forEach(item => {
      item.classList.remove("selected");
      if (item.getAttribute("data-id") === topicId) {
        item.classList.add("selected");
      }
    });
    selectedTopicId = topicId;
    const topic = TOPIC_LIST.find(t => t.id === topicId);
    topicSelectValue.textContent = topic ? topic.name : topicId;
    topicSelectValue.style.color = "#f1f5f9";
  }

  // ==================== IMAGE HANDLING ====================
  function handleImageSelect(file) {
    if (!file || !file.type.startsWith("image/")) return;
    if (file.size > 10 * 1024 * 1024) {
      setStatus("ပုံ 10MB ထက်မကျော်ရပါ", "error");
      return;
    }
    selectedImageFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
      imagePreview.src = e.target.result;
      imagePreviewContainer.style.display = "block";
      imageDropzone.classList.add("has-image");
    };
    reader.readAsDataURL(file);
  }

  function removeImage() {
    selectedImageFile = null;
    imagePreview.src = "";
    imagePreviewContainer.style.display = "none";
    imageDropzone.classList.remove("has-image");
    imageInput.value = "";
  }

  // ==================== STATUS ====================
  function setStatus(text, type = "info") {
    statusText.textContent = text;
    statusBar.className = "status-bar";
    if (type === "success") statusBar.classList.add("success");
    if (type === "error") statusBar.classList.add("error");
    if (type === "loading") statusBar.classList.add("loading");
  }

  // ==================== LOADING ====================
  function setLoading(loading) {
    isSending = loading;
    sendBtn.disabled = loading;
    sendBtn.innerHTML = loading ? '<span class="spinner"></span> ပို့နေသည်...' : '📤 ပို့မည်';
  }

  // ==================== SEND ====================
  async function sendMessage() {
    if (isSending) return;
    
    const message = messageTextarea.value.trim();
    const hasPhoto = selectedImageFile !== null;
    const hasText = message !== "";

    if (!hasPhoto && !hasText) {
      setStatus("စာသား သို့မဟုတ် ပုံ ထည့်ပါ", "error");
      return;
    }

    const bot = BOT_LIST[selectedBotIndex];
    const topicId = selectedTopicId;
    const topicLabel = topicId === "1" ? "General" : TOPIC_LIST.find(t => t.id === topicId)?.name || topicId;

    setLoading(true);
    setStatus(`${bot.emoji} ${bot.name} → ${topicLabel} ပို့နေသည်...`, "loading");

    try {
      if (hasPhoto) {
        const formData = new FormData();
        formData.append("chat_id", GROUP_USERNAME);
        formData.append("photo", selectedImageFile);
        if (topicId !== "1") formData.append("message_thread_id", topicId);
        if (hasText) { formData.append("caption", message); formData.append("parse_mode", "HTML"); }

        const res = await fetch(`https://api.telegram.org/bot${bot.token}/sendPhoto`, { method: "POST", body: formData });
        const data = await res.json();

        if (data.ok) {
          setStatus(`✅ ${bot.emoji} ${bot.name} → ${topicLabel} ပို့ပြီး!`, "success");
          removeImage();
        } else {
          setStatus(`❌ ${data.description}`, "error");
        }
      } else {
        const formData = new URLSearchParams();
        formData.append("chat_id", GROUP_USERNAME);
        formData.append("text", message);
        if (topicId !== "1") formData.append("message_thread_id", topicId);
        formData.append("parse_mode", "HTML");

        const res = await fetch(`https://api.telegram.org/bot${bot.token}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString()
        });
        const data = await res.json();

        if (data.ok) {
          setStatus(`✅ ${bot.emoji} ${bot.name} → ${topicLabel} ပို့ပြီး!`, "success");
        } else {
          setStatus(`❌ ${data.description}`, "error");
        }
      }
    } catch (e) {
      setStatus(`🌐 အင်တာနက်စစ်ဆေးပါ`, "error");
    } finally {
      setLoading(false);
    }
  }

  // ==================== EVENT LISTENERS ====================
  
  // Bot Select Button
  botSelectBtn.addEventListener("click", function(e) {
    e.preventDefault();
    renderBotModal();
    botModal.classList.add("active");
  });

  // Topic Select Button
  topicSelectBtn.addEventListener("click", function(e) {
    e.preventDefault();
    renderTopicModal();
    topicModal.classList.add("active");
  });

  // Modal Done Buttons
  botModalDone.addEventListener("click", function(e) {
    e.preventDefault();
    botModal.classList.remove("active");
  });
  topicModalDone.addEventListener("click", function(e) {
    e.preventDefault();
    topicModal.classList.remove("active");
  });

  // Close modal on overlay click
  botModal.addEventListener("click", function(e) {
    if (e.target === botModal) botModal.classList.remove("active");
  });
  topicModal.addEventListener("click", function(e) {
    if (e.target === topicModal) topicModal.classList.remove("active");
  });

  // Image Dropzone
  imageDropzone.addEventListener("click", function(e) {
    if (e.target === removeImageBtn) return;
    e.preventDefault();
    imageInput.click();
  });
  imageInput.addEventListener("change", function(e) {
    if (e.target.files && e.target.files[0]) handleImageSelect(e.target.files[0]);
  });
  removeImageBtn.addEventListener("click", function(e) {
    e.preventDefault();
    e.stopPropagation();
    removeImage();
  });

  // Send Button
  sendBtn.addEventListener("click", function(e) {
    e.preventDefault();
    e.stopPropagation();
    sendMessage();
  });
  sendBtn.addEventListener("touchend", function(e) {
    e.preventDefault();
    e.stopPropagation();
    sendMessage();
  });

  // Char count
  messageTextarea.addEventListener("input", function() {
    charCount.textContent = messageTextarea.value.length + " / 4096";
  });

  // Keyboard shortcut
  messageTextarea.addEventListener("keydown", function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });

  // ==================== INIT ====================
  function init() {
    charCount.textContent = "0 / 4096";
    botSelectValue.textContent = BOT_LIST[0].name;
    botSelectValue.style.color = BOT_LIST[0].color;
    const defaultTopic = TOPIC_LIST.find(t => t.id === selectedTopicId);
    topicSelectValue.textContent = defaultTopic ? defaultTopic.name : selectedTopicId;
    setStatus("အဆင်သင့်ဖြစ်ပါပြီ • Bot နှင့် Topic ရွေးပါ");
    console.log("✅ Ready");
  }

  init();
})();
</script>
</body>
</html>
